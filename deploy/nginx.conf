# Nginx reverse proxy for AutoList AI — copy to /etc/nginx/sites-available/autolist
# then: ln -s /etc/nginx/sites-available/autolist /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# HTTPS is added automatically by certbot (see DEPLOY.md).

server {
    listen 80;
    server_name autolist.ai www.autolist.ai;   # <-- your domain

    client_max_body_size 60m;                   # uploads up to ~55MB

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Server-Sent Events (job progress) — disable buffering so events stream live
    location ~ ^/api/jobs/.+/events$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
